{% extends "admin/base.html" %}
{% block body %}
<h1>관리자 로그인</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" style="max-width:320px">
<label for="user">아이디</label><input id="user" name="user" autocomplete="username" required>
<label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<p><button>로그인</button></p>
</form>
{% endblock %}
