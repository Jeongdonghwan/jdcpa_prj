<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>관리자</title>
<style>body{font-family:system-ui,sans-serif;margin:20px;max-width:1100px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:6px;text-align:left;font-size:.9rem;vertical-align:top}
label{display:block;margin:10px 0 2px;font-weight:600}input,textarea,select{padding:6px;font:inherit}form.wide input,form.wide textarea{width:100%}textarea{min-height:70px}.err{color:#b00020}nav a{margin-right:12px;white-space:nowrap}nav{line-height:2}
.preview{border:1px solid #ccc;padding:12px;margin:12px 0}</style></head>
<body>
{% if session.admin %}<nav>{% for name, t in tables.items() %}<a href="{{ url_for('admin.rows', table=name) }}">{{ t.label }}</a>{% endfor %}<br>
{% for name, label in pages.items() %}<a href="{{ url_for('admin.' ~ name) }}">{{ label }}</a>{% endfor %}
<form method="post" action="{{ url_for('admin.logout') }}" style="display:inline"><input type="hidden" name="csrf" value="{{ session.csrf }}"><button>로그아웃</button></form></nav><hr>{% endif %}
{% block body %}{% endblock %}
</body></html>
